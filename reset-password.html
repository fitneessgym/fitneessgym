<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تغيير كلمة المرور | FITNESS GYM</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">
<main class="login-shell">
  <div class="login-card">
    <img src="logo.jpeg" class="login-logo" alt="FITNESS GYM">
    <div class="tag">PASSWORD RESET</div>
    <h1 id="title">تغيير كلمة المرور</h1>
    <p id="message">أدخل بريد حساب الإدارة لإرسال رابط آمن لتغيير كلمة المرور.</p>
    <form id="requestForm" class="admin-form">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" value="shakarnah2004@gmail.com" required>
      <div id="requestError" class="login-error"></div>
      <button class="btn orange" type="submit">إرسال رابط التغيير</button>
      <a class="back-link" href="admin-login.html">العودة لتسجيل الدخول</a>
    </form>
    <form id="newPasswordForm" class="admin-form" style="display:none">
      <label>كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label>تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <div id="resetError" class="login-error"></div>
      <button class="btn orange" type="submit">حفظ كلمة المرور</button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const requestForm=document.getElementById('requestForm');
const newPasswordForm=document.getElementById('newPasswordForm');
const message=document.getElementById('message');
const title=document.getElementById('title');

function showResetForm(){
  requestForm.style.display='none';
  newPasswordForm.style.display='block';
  title.textContent='ضع كلمة مرور جديدة';
  message.textContent='أدخل كلمة المرور الجديدة لحساب الإدارة ثم اضغط حفظ.';
}

window.supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY' || session?.user){
    showResetForm();
  }
});

requestForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const err=document.getElementById('requestError');
  const btn=requestForm.querySelector('button');
  err.textContent=''; btn.disabled=true; btn.textContent='جاري الإرسال...';
  try{
    const {error}=await window.supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:'https://fitneessgym.github.io/reset-password.html'});
    if(error) throw error;
    message.textContent='تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني. افتح الرابط من البريد.';
    err.style.color='green'; err.textContent='تم الإرسال بنجاح.';
  }catch(error){
    console.error(error); err.style.color=''; err.textContent=error.message||'تعذر إرسال رابط التغيير.';
  }finally{btn.disabled=false; btn.textContent='إرسال رابط التغيير';}
});

newPasswordForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const p=document.getElementById('newPassword').value;
  const c=document.getElementById('confirmPassword').value;
  const err=document.getElementById('resetError');
  if(p!==c){err.textContent='كلمتا المرور غير متطابقتين.'; return;}
  if(p.length<6){err.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.'; return;}
  const btn=newPasswordForm.querySelector('button'); btn.disabled=true; btn.textContent='جاري الحفظ...'; err.textContent='';
  try{
    const {error}=await window.supabaseClient.auth.updateUser({password:p});
    if(error) throw error;
    err.style.color='green'; err.textContent='تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.';
    setTimeout(()=>window.location.href='admin-login.html',1200);
  }catch(error){
    console.error(error); err.style.color=''; err.textContent=error.message||'تعذر تغيير كلمة المرور.';
  }finally{btn.disabled=false; btn.textContent='حفظ كلمة المرور';}
});

// If the page was opened with an OAuth/recovery hash, Supabase will detect it.
if(window.location.hash.includes('access_token') || window.location.hash.includes('type=recovery')) showResetForm();
</script>
</body>
</html>
